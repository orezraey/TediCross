telegram:
  # Multiple bot support - you can define multiple Telegram bots
  bots:
    - name: elonmusk # Name to identify this bot
      token: TELEGRAM_TOKEN_1
    - name: nasa # Second bot example
      token: TELEGRAM_TOKEN_2
  
  # Legacy single token support (will be converted to bots array automatically)
  # token: TELEGRAM_BOT_TOKEN_HERE # Uncomment this and comment bots array above for single bot mode
  
  useFirstNameInsteadOfUsername: false
  colonAfterSenderName: false
  skipOldMessages: true
  sendEmojiWithStickers: true
  useCustomEmojiFilter: false # Experimental, might break
  replaceAtWithHash: false # Experimental, might break
  replaceExcessiveSpaces: false # Experimental, might break
  removeNewlineSpaces: false # Experimental, might break
  suppressFileTooBigMessages: false
  suppressThisIsPrivateBotMessage: false
discord:
  useNickname: false
  token: DISCORD_BOT_TOKEN_HERE # Discord bot tokens look like this: MjI3MDA1NzIvOBQ2MzAzMiMz.DRf-aw.N0MVYtDxXYPSQew4g2TPqvQve2c
  skipOldMessages: true
  replyLength: 100
  maxReplyLines: 2
  suppressThisIsPrivateBotMessage: false
  enableCustomStatus: false
  customStatusMessage: "TediCross"
bridges:
  - name: Elon Musk Bridge
    direction: both #d2t, t2c
    telegram:
      chatId: TELEGRAM_CHAT_ID_1 # Telegram chat for Elon Musk
      botName: elonmusk # Bot to use for this bridge
      relayJoinMessages: true
      relayLeaveMessages: true
      sendUsernames: true
      crossDeleteOnDiscord: true
    discord:
      channelId: 'DISCORD_CHANNEL_ID_1' # Discord channel
      relayJoinMessages: true
      relayLeaveMessages: true
      sendUsernames: true
      crossDeleteOnTelegram: true
      disableWebPreviewOnTelegram: false
      useEmbeds: 'auto' # always / never / auto
  
  - name: NASA Bridge
    direction: both #dt2, t2d
    telegram:
      chatId: TELEGRAM_CHAT_ID_2 # Telegram chat for NASA
      botName: nasa # Bot to use for this bridge
      relayJoinMessages: true
      relayLeaveMessages: true
      sendUsernames: true
      crossDeleteOnDiscord: true
    discord:
      channelId: 'DISCORD_CHANNEL_ID_2' # Same Discord channel
      relayJoinMessages: true
      relayLeaveMessages: true
      sendUsernames: true
      crossDeleteOnTelegram: true
      disableWebPreviewOnTelegram: false
      useEmbeds: 'auto' # always / never / auto
debug: false
messageTimeoutAmount: 24
messageTimeoutUnit: 'hours' # This string must be a valid Moment time format. Example: seconds, minutes, hours, days, weeks, months, years
persistentMessageMap: false
